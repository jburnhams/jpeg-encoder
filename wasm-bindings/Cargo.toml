[package]
name = "jpeg-encoder-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebAssembly bindings for jpeg-encoder's streaming StripEncoder (published to npm, not crates.io)"
license = "(MIT OR Apache-2.0) AND IJG"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jpeg-encoder = { path = ".." }
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
