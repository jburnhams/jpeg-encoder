name: WebAssembly package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (must match the wasm-bindgen crate version)
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Browser test
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - run: npm run example

      - name: Visual report
        run: npm run report

      - uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: report/

      - name: Benchmark
        run: |
          npm run bench -- --quick --json bench-results.json | tee bench.txt
          { echo '### Benchmark (quick, GitHub runner)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the npm package contents
        run: npm pack --dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: pkg/

      - name: Prepare GitHub Pages demo
        run: npm run prepare:docs

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ./docs

  # The package is built once above; check it on every supported Node version
  node-versions:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: pkg
          path: pkg/

      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:types

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, node-versions]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
