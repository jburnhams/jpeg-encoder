[package]
name = "jpeg-encoder"
version = "0.8.0"
authors = ["Volker Ströbel <volkerstroebel@mysurdity.de>"]
edition = "2024"
license = "(MIT OR Apache-2.0) AND IJG"
description = "JPEG encoder"
categories = ["multimedia::images"]
keywords = ["jpg", "jpeg", "encoder", "image"]
readme = "README.md"
repository = "https://github.com/vstroebel/jpeg-encoder"
rust-version = "1.89"

# Fork addition: the npm package is built from the wasm-bindings crate
[workspace]
members = [".", "wasm-bindings"]
resolver = "2"

[features]
default = ["std"]
simd = ["std"]
std = []
use_wide = ["wide", "bytemuck"]

# DO NOT USE THIS IN PRODUCTION. Expose several internal functions for benchmark purposes.
benchmark = []

[dependencies]
wide = { version = "1.0", optional = true, default-features = false }
bytemuck = { version = "1.24", optional = true, default-features = false }

[dev-dependencies]
jpeg-decoder = { version = "0.3", default-features = false }

[profile.dev]
opt-level = 1

# Fork addition: size-optimized profile for the WebAssembly build (npm run build:wasm)
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
